version: 1
registry: paper-policy-hard
rules:
  - id: AUTH.INTEGRITY_PRECEDENCE
    title: Integrity outranks style
    force: hard
    scope: [workflow, writing, review, figures, tables, citations]
    artifacts: [policy, prose, tex, bibtex, figure, table, paper_outline]
    phases: [outline, draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Never relax an academic-integrity rule to satisfy house style, venue rhetoric, or user preference.
    checks:
      - {kind: manual, evidence_required: true, description: 'Confirm every conflict resolution preserves truth and evidence boundaries.'}
    failure: {draft: block, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [A01, A02, A03, A11, A12, A13, A14, A15]
    source: {origin: user-decision, note: 'Core authority rule.'}

  - id: ROUTE.SKILL_BOUNDARY
    title: Preserve skill ownership boundaries
    force: hard
    scope: [workflow]
    artifacts: [policy]
    phases: [outline, draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Route prose, review, artifacts, and evidence work to their owning skills and never claim an unperformed handoff is complete.
    checks:
      - {kind: manual, evidence_required: true, description: 'Compare the requested deliverable with the owning skill contract.'}
    failure: {draft: report, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [A05, A06, A07, A08, G14]
    source: {origin: local-house-policy, note: 'Modular architecture boundary.'}

  - id: FACT.NO_FABRICATION
    title: No fabricated facts or results
    force: hard
    scope: [writing, review, figures, tables, citations]
    artifacts: [prose, figure, table, bibtex]
    phases: [outline, draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Do not invent facts, experiments, baselines, metrics, p-values, years, venues, trends, error bars, sample sizes, or system components.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Trace each factual assertion and artifact value to user-provided or approved evidence.'}
    failure: {draft: placeholder, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [B01, B09, I02, J03]
    source: {origin: local-house-policy, note: 'Non-waivable integrity rule.'}

  - id: CLAIM.EVIDENCE_BOUND
    title: Claims stay within evidence
    force: hard
    scope: [writing, review]
    artifacts: [prose]
    phases: [outline, draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Keep every claim within the supplied evidence, experiment scope, threat model, dataset, and workload boundary.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Compare the claim verb and scope with its evidence anchor.'}
    failure: {draft: narrow, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [B02, B05, B07, B10, J15]
    source: {origin: local-house-policy, note: 'Claim calibration hard core.'}

  - id: CLAIM.CAUSALITY_DISCIPLINE
    title: Separate observation, association, and causation
    force: hard
    scope: [writing, review]
    artifacts: [prose]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Do not express descriptive observations or correlations as causal findings without a causal design.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Match causal verbs to the study design and supplied evidence.'}
    failure: {draft: narrow, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [B03]
    source: {origin: local-house-policy, note: 'Evidence-language integrity.'}

  - id: CLAIM.SECURITY_SCOPE
    title: Do not imply unsupported cryptographic guarantees
    force: hard
    scope: [writing, review]
    artifacts: [prose]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: paper_type, when: [security, systems, protocol]}
    requirement: Do not describe empirical, interface-level, or systems mechanisms as cryptographic guarantees unless formally supported.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Compare security wording with the threat model, construction, and proof evidence.'}
    failure: {draft: narrow, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [B04]
    source: {origin: local-house-policy, note: 'Security claim boundary.'}

  - id: CLAIM.NOVELTY_SUPPORT
    title: Novelty and SOTA claims require comparison evidence
    force: hard
    scope: [writing, review, citations]
    artifacts: [prose]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Use first, novel, state-of-the-art, or equivalent claims only with an approved comparison or sufficient evidence.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Locate the curated comparison or user confirmation supporting the novelty scope.'}
    failure: {draft: narrow, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [B11]
    source: {origin: local-house-policy, note: 'Novelty integrity.'}

  - id: CLAIM.CAVEAT_PRESERVED
    title: Preserve required caveats
    force: hard
    scope: [writing, review]
    artifacts: [prose]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: "Preserve material adverse findings, scientifically necessary conditions and applicable disclosure requirements during editing. Correct an overclaim directly; redundant anticipatory defenses may be removed when the resulting claim is accurate without them."
    checks: [{"kind": "semantic", "evidence_required": true, "description": "Check whether removed text carries necessary scientific information. Trace retained information after moves or merges; explain deletion of filler or redundant defenses without inventing a surviving home."}]
    failure: {draft: block, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [B06, B15, K06, K07]
    source: {origin: user-decision, note: 'Limitations and structural safety.'}

  - id: PROSE.ANTI_AI_MEANING_PRESERVATION
    title: Anti-AI cleanup preserves scientific meaning
    force: hard
    scope: [writing, review, workflow]
    artifacts: [prose, tex, policy]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: mode, when: [anti_ai_cleanup, prose_cleanup, writing_anti_ai]}
    requirement: During style-only cleanup, preserve supported claim strength, causal status, evidence scope, material limitations, technical terminology, citation attachment, quantitative facts, and the author's evidence-bound position. This does not protect known errors or redundant anticipatory defenses. Implement authorized evidence-supported corrections explicitly; do not change scientific meaning merely for stylistic variation.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Compare the source and revision claim by claim, including modality, causal verbs, qualifiers, terminology, citation attachment, values, and required caveats.'}
    failure: {draft: block, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [N07]
    source: {origin: user-decision, note: 'Independently authored integrity boundary informed by comparative review of public Anti-AI guidance.'}

  - id: WORKFLOW.NO_AI_DETECTOR_GATE
    title: Do not use AI-detector or authorship scores as a gate
    force: hard
    scope: [workflow, writing, review]
    artifacts: [policy, prose]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: mode, when: [anti_ai_cleanup, prose_cleanup, writing_anti_ai, authorship_review, detector_review]}
    requirement: Do not use AI-detector, perplexity, authenticity, human-likeness, or equivalent scores to assign manuscript compliance, submission readiness, or authorship; do not alter prose to evade such detectors. Diagnose concrete textual defects without claiming AI authorship from style alone.
    checks:
      - {kind: manual, evidence_required: true, description: 'Inspect the audit rationale and rewrite objective for detector-based gating, evasion tactics, or unsupported authorship inference.'}
    failure: {draft: block, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [N08]
    source: {origin: user-decision, note: 'Independently authored detector-safety rule; no external implementation or text is incorporated.'}

  - id: CLAIM.KNOWN_BIAS_DIRECTION
    title: Disclose the direction of known measurement bias
    force: hard
    scope: [writing, review]
    artifacts: [prose, figure, table]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: profile, when: [known-measurement-bias]}
    requirement: For each characterized systematic measurement, extraction, missingness, or labeling error, state the evidence for its direction, identify the affected claims or metrics, and say whether it makes each conclusion conservative, anti-conservative, or directionally indeterminate; do not assert a direction without support.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Trace the error mechanism to an affected claim or metric and verify the stated direction or explicit indeterminacy against supplied evidence.'}
    failure: {draft: narrow, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [N01]
    source: {origin: user-decision, note: 'Conditional hard rule informed by reference-paper evidence architecture; no text or data reproduced.'}

  - id: CITE.NO_MEMORY_BIBTEX
    title: Never generate citations from memory
    force: hard
    scope: [writing, review, citations]
    artifacts: [prose, bibtex]
    phases: [outline, draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Never invent a paper, author, year, DOI, BibTeX entry, or citation key from memory.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Require supplied evidence or primary-source metadata verified within the authorized literature/citation task; never accept memory alone.'}
    failure: {draft: placeholder, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [C01, C03, C13]
    source: {origin: local-house-policy, note: 'Citation integrity.'}

  - id: CITE.APPROVED_SOURCE_ONLY
    title: Use approved citation sources by default
    force: hard
    scope: [writing, review, citations]
    artifacts: [prose, bibtex]
    phases: [outline, draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Respect the task source mode. Use declared local sources for polish and a closed corpus when explicitly required. A literature-completion, novelty-checking, or citation-verification request authorizes scoped public primary-source lookup and supported local citation updates when edits are requested; record the verified sources and existing authorization without requiring a separate citation-audit invocation.
    checks:
      - {kind: deterministic, evidence_required: false, description: 'Compare manuscript keys with approved bibliography sources.'}
      - {kind: manual, evidence_required: true, description: 'Check that non-local retrieval and any local updates are covered by the current request or still-valid authorization, preserve closed-corpus/confidentiality constraints, and have source locators.'}
    failure: {draft: placeholder, final: block}
    autofix: none
    waiver: {allowed: true, authorities: [user]}
    decision_refs: [C02, C04, X01, X02]
    source: {origin: user-decision, note: 'Local polish and closed-corpus boundaries retained; user-approved 2026-09-08 batch 1 permits scoped primary-source completion without repeat authorization.'}

  - id: CITE.NO_INVENTED_SUPPORT
    title: Do not infer support from metadata
    force: hard
    scope: [writing, review, citations]
    artifacts: [prose, bibtex]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Do not claim that a paper supports a specific statement merely because its title, DOI, URL, or metadata matches.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Require user-provided material, a source span, manuscript context, or an approved evidence record for specific claims.'}
    failure: {draft: narrow, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [C05, C08, C09]
    source: {origin: local-house-policy, note: 'Metadata is not claim support.'}

  - id: CITE.SOURCE_LOCATOR_REQUIRED
    title: Specific quotations and paraphrases require locators
    force: hard
    scope: [citations, review, writing]
    artifacts: [prose]
    phases: [polish, submission, rebuttal, camera_ready]
    activation: {type: profile, when: [citation-audit, final-citation-check]}
    requirement: Record a verbatim span and locator for direct quotations and a semantically matching source span and locator for specific paraphrases.
    checks:
      - {kind: manual, evidence_required: true, description: 'Inspect the source span, page or section locator, claim type, and status.'}
    failure: {draft: placeholder, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [C06, C07, C19, M08]
    source: {origin: imported-design, note: 'Claim-span ledger compatible with user-selected evidence workflows.'}

  - id: CITE.UNUSED_KEYS_REPORTED
    title: Final citation checks report unused keys
    force: hard
    scope: [citations, review]
    artifacts: [bibtex]
    phases: [submission, camera_ready]
    activation: {type: profile, when: [final-citation-check]}
    requirement: Report unused bibliography keys during a final citation check without deleting or renaming them automatically.
    checks:
      - {kind: deterministic, evidence_required: false, description: 'Compare local bibliography keys with manuscript citation keys.'}
    failure: {draft: report, final: report}
    autofix: none
    waiver: {allowed: true, authorities: [user]}
    decision_refs: [C16]
    source: {origin: user-decision, note: 'Final citation hygiene.'}

  - id: LATEX.PRESERVE_STRUCTURE
    title: Preserve LaTeX structure during rewriting
    force: hard
    scope: [writing, review]
    artifacts: [tex]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: feature, when: [latex_manuscript]}
    requirement: "Preserve LaTeX citations, labels, references, equations and macros during prose-only cleanup. An authorized structural edit, citation repair or template migration includes necessary coordinated token changes; update consumers and verify meaning and compilation without repeat permission."
    checks: [{"kind": "manual", "evidence_required": true, "description": "Inspect changed LaTeX tokens against the authorized scope, dependent references and build evidence."}, {"kind": "semantic", "evidence_required": true, "description": "Confirm citation attachment and mathematical meaning remain correct; changes implement the authorized revision."}]
    failure: {draft: block, final: block}
    autofix: none
    waiver: {allowed: true, authorities: [user]}
    decision_refs: [D01, D02]
    source: {origin: local-house-policy, note: 'LaTeX preservation contract.'}

  - id: LATEX.REFERENCEABLE_DISPLAY
    title: Referenceable displays use structured environments
    force: hard
    scope: [writing, review]
    artifacts: [tex]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: feature, when: [latex_manuscript]}
    requirement: Ensure every equation reference resolves to the intended displayed expression and an appropriate number or explicit tag. Supported alternative environments and external labels are valid; source-scanner coverage alone cannot determine their correctness.
    checks:
      - {kind: deterministic, evidence_required: false, description: 'Check supported numbered or tagged displays. Report custom or unresolved forms as review hints and inspect the compiled reference before asserting correctness.'}
    failure: {draft: block, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [D03]
    source: {origin: user-decision, note: 'Referenceable display contract.'}

  - id: PROSE.ABBREVIATION_FIRST_USE
    title: Expand abbreviations on first use
    force: hard
    scope: [writing, review]
    artifacts: [prose, tex]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Expand each non-standard abbreviation at first use and use it consistently afterward.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Locate the first use and later occurrences of each abbreviation.'}
    failure: {draft: block, final: block}
    autofix: assisted
    waiver: {allowed: true, authorities: [user, venue]}
    decision_refs: [D12]
    source: {origin: user-decision, note: 'Abbreviation hygiene.'}

  - id: PROSE.NO_INTERNAL_PROVENANCE
    title: Keep internal provenance out of paper prose
    force: hard
    scope: [writing, review, figures, tables]
    artifacts: [prose, tex, figure, table]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: "Keep irrelevant internal workflow bookkeeping out of manuscript prose and captions. Retain scientifically necessary implementation details, artifact identifiers and truthful synthetic-data disclosures. A path, script name or renderer term alone does not establish a violation."
    checks: [{"kind": "deterministic", "evidence_required": false, "description": "Locate possible workflow markers as review hints, not conclusive violations."}, {"kind": "semantic", "evidence_required": true, "description": "Determine whether each occurrence is irrelevant bookkeeping or scientifically necessary content from its actual context."}]
    failure: {draft: report, final: block}
    autofix: assisted
    waiver: {allowed: true, authorities: [user, venue]}
    decision_refs: [D08, D10, F22]
    source: {origin: local-house-policy, note: 'Originated in Academic-Paper-Skills.'}

  - id: PROSE.EVIDENCE_BOUND_LANGUAGE
    title: Evidence-bound intensifiers and attributions
    force: hard
    scope: [writing, review]
    artifacts: [prose]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Use significant, substantial, remarkable, research shows, experts argue, and equivalent language only with a specific value, statistical meaning, or source.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Inspect the nearby value, statistical definition, or citation evidence.'}
    failure: {draft: narrow, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [F07, F08]
    source: {origin: local-house-policy, note: 'Evidence-language guardrail.'}

  - id: PROSE.ACADEMIC_VOICE_BOUNDARY
    title: Keep author voice academic and evidence-bound
    force: hard
    scope: [writing, review]
    artifacts: [prose]
    phases: [outline, draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: Allow measured author judgment without casual humanizer language, evidence-free opinion, or humor substituting for analysis.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Confirm judgment is tied to a design choice, evidence boundary, or explicit author position.'}
    failure: {draft: narrow, final: block}
    autofix: assisted
    waiver: {allowed: true, authorities: [user, venue]}
    decision_refs: [F20, X16]
    source: {origin: user-decision, note: 'Measured voice allowed; casual humanization is not.'}

  - id: PROSE.TERMINOLOGY_AND_FORMATTING
    title: "Preserve technical identity and meaning"
    force: hard
    scope: [writing, review]
    artifacts: [prose, tex]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: always, when: []}
    requirement: "Preserve the identity of technical terms and meaning-bearing notation. Coordinated renaming is valid within the authorized edit when definitions and consumers remain consistent. Typography frequency alone is a soft presentation concern."
    checks: [{"kind": "semantic", "evidence_required": true, "description": "Check term identity, definitions and notation semantics; assess typography preferences under soft guidance."}]
    failure: {draft: report, final: block}
    autofix: assisted
    waiver: {allowed: true, authorities: [user, venue]}
    decision_refs: ["F14"]
    source: {origin: local-house-policy, note: 'Terminology and typography discipline.'}

  - id: STRUCT.INTRO_CONCRETE_GAP
    title: Introduction states a concrete gap
    force: hard
    scope: [writing, review]
    artifacts: [prose]
    phases: [draft, polish, submission, camera_ready]
    activation: {type: feature, when: [introduction]}
    requirement: "Make the research question and contribution rationale concrete. Ground claims about prior work in identified evidence. Replication, measurement, synthesis or theory may be motivated by uncertainty or a knowledge need without claiming that previous methods fail."
    checks: [{"kind": "semantic", "evidence_required": true, "description": "Identify the question, its importance and the supported relation to prior work; do not require a fixed deficit narrative."}]
    failure: {draft: narrow, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [E12]
    source: {origin: local-house-policy, note: 'Gap standard.'}

  - id: STRUCT.CONCLUSION_NO_NEW_CLAIMS
    title: Conclusion introduces no new claims or evidence
    force: hard
    scope: [writing, review]
    artifacts: [prose]
    phases: [draft, polish, submission, camera_ready]
    activation: {type: feature, when: [conclusion]}
    requirement: "Ground the Conclusion in the body of the manuscript. Do not introduce previously unsupported findings, experiments or guarantees. A synthesis, derived summary or relevant citation is valid when its premises and support are available and it does not substitute for missing analysis."
    checks: [{"kind": "semantic", "evidence_required": true, "description": "Trace substantive conclusions to body evidence and inspect any new synthesis or reference for support rather than failing on citation or numeral presence."}]
    failure: {draft: block, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [E17]
    source: {origin: local-house-policy, note: 'Conclusion closure rule.'}

  - id: THREATS.CLAIM_MITIGATION_RESIDUAL
    title: Threats map to claims, mitigations, and residual boundaries
    force: hard
    scope: [writing, review]
    artifacts: [prose, tex]
    phases: [draft, polish, submission, rebuttal, camera_ready]
    activation: {type: feature, when: [threats_to_validity, limitations_content]}
    requirement: For every load-bearing threat or limitation, identify the affected claim, research question, or inference; state the mitigation or existing check; and preserve the residual risk after mitigation. If no mitigation exists, say so explicitly rather than implying resolution.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Map each load-bearing threat or limitation to an affected claim or RQ, a supported mitigation or explicit absence, and a surviving residual boundary.'}
    failure: {draft: block, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [N05]
    source: {origin: user-decision, note: 'Hard threat-analysis core informed by reference-paper analysis; no text or data reproduced.'}

  - id: TABLE.PROPOSED_ROW_GROUNDED
    title: Ground proposed rows and uniqueness highlights
    force: hard
    scope: [review, tables]
    artifacts: [table]
    phases: [draft, polish, submission, camera_ready]
    activation: {type: feature, when: [related_work_table]}
    requirement: Include a proposed, ours, or this-work row only when the manuscript actually contains the named artifact and every marker is supported by that artifact. Treat a meaning-bearing uniqueness label or coverage-delta cell highlight as factual only when the comparison corpus is defined and row-wise evidence supports the distinction; unless that corpus is exhaustive, describe the capability as absent from the compared rows rather than universally unique to this work.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Trace the proposed row label and every marker to an existing manuscript artifact.'}
      - {kind: semantic, evidence_required: true, description: 'Trace every meaning-bearing uniqueness label or coverage-delta highlight to a defined comparison corpus and defensible row-wise evidence, and verify that the wording does not exceed that corpus.'}
    failure: {draft: block, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [G09]
    source: {origin: local-house-policy, note: 'Proposed-row grounding and meaning-bearing uniqueness claims remain factual hard constraints; row granularity and visual emphasis remain soft.'}

  - id: TABLE.VALUES_GROUNDED
    title: Table values are grounded
    force: hard
    scope: [tables, review]
    artifacts: [table]
    phases: [draft, polish, submission, camera_ready]
    activation: {type: feature, when: [data_table, result_table]}
    requirement: Use only supplied data, manuscript values, or user-confirmed values and never hide variance or redefine the best value through visual emphasis.
    checks:
      - {kind: deterministic, evidence_required: false, description: 'Confirm every declared source-data path exists.'}
      - {kind: semantic, evidence_required: true, description: 'Trace every value, direction, best-value emphasis, and variance representation to source data.'}
    failure: {draft: block, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [H08, H09, H10, H17]
    source: {origin: local-house-policy, note: 'Data and presentation integrity.'}

  - id: FIG.SOURCE_DATA_REQUIRED
    title: Data figures require source data
    force: hard
    scope: [figures, review]
    artifacts: [figure]
    phases: [draft, polish, submission, camera_ready]
    activation: {type: feature, when: [data_figure]}
    requirement: Generate numeric figures from supplied source data and never use image generation for precise plots.
    checks:
      - {kind: deterministic, evidence_required: false, description: 'Confirm every declared source-data path and plotting script exists.'}
      - {kind: manual, evidence_required: true, description: 'Identify the source file, plotted fields, and generation script.'}
    failure: {draft: block, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [I01, I02, J01]
    source: {origin: local-house-policy, note: 'Data-figure integrity.'}

  - id: FIG.NO_INVENTED_COMPONENTS
    title: Conceptual figures preserve manuscript structure
    force: hard
    scope: [figures, review]
    artifacts: [figure]
    phases: [draft, polish, submission, camera_ready]
    activation: {type: feature, when: [conceptual_figure]}
    requirement: Do not add actors, flows, mechanisms, boundaries, or relationships not supported by the manuscript.
    checks:
      - {kind: semantic, evidence_required: true, description: 'Map each visual component and edge to manuscript text.'}
    failure: {draft: block, final: block}
    autofix: none
    waiver: {allowed: false, authorities: []}
    decision_refs: [I03]
    source: {origin: local-house-policy, note: 'Conceptual-figure fidelity.'}

  - id: FIG.FINAL_WIDTH_READABLE
    title: Final figures are readable at target width
    force: hard
    scope: [figures, review]
    artifacts: [figure]
    phases: [submission, camera_ready]
    activation: {type: profile, when: [final-figure]}
    requirement: Render each final paper figure at its actual LaTeX column or text width and confirm that labels, annotations, legends, and panel identifiers remain readable without clipping or overlap.
    checks:
      - {kind: manual, evidence_required: true, description: 'Inspect the rendered figure at target column width.'}
    failure: {draft: block, final: block}
    autofix: assisted
    waiver: {allowed: false, authorities: []}
    decision_refs: [I13, I19]
