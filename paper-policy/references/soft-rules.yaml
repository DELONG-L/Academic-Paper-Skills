  - id: WORKFLOW.COMPLEX_TASK_STATE
    title: Preserve useful task continuity without mandatory workflow files
    force: soft
    scope: [workflow, writing, review]
    artifacts: [policy]
    phases: [outline, draft, polish, submission, rebuttal, camera_ready]
    default: Reuse a concise brief, claim-to-source mapping, and open decisions when they help substantial paper work; revisit dependent claims after source changes.
    allowed_variants:
      - Keep a short task's working context in the conversation without extra files.
      - Reuse existing notes or manuscript annotations instead of creating parallel ledgers.
      - Persist compact records for resumed work, collaboration, or an explicit user request.
    selection_factors: [task_scope, evidence_maturity, manuscript_state]
    avoid:
      - Blocking readiness because a preferred brief, ledger, or stage-state file is absent
      - Treating informal notes as admissible compliance evidence or stale source snapshots as current
      - Creating empty documents solely to satisfy a workflow template
    report_when: Explain a material continuity gap; ordinary choices of note format require no compliance report.
    decision_refs: [A10, K09, K10, K11, M03, M04, M05]
    source: {origin: user-decision, note: '2026-09-09 batch 2: task-proportionate workflow; source-bound compliance evidence remains governed separately.'}
